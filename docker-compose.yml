
name: smartx

services:
  api:
    build:
      context: ./SmartX.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SMARTX_INTERNAL_API_BASE_URL: http://127.0.0.1:8080
      Attachments__EncryptionKey: ${SMARTX_ATTACHMENT_KEY:?Set SMARTX_ATTACHMENT_KEY in the root .env file}
      Attachments__StoragePath: /app/App_Data/Attachments
    volumes:
      - smartx_attachments:/app/App_Data/Attachments
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./SmartX.Client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - api
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped

volumes:
  smartx_attachments:
